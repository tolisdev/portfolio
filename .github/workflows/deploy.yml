name: Deploy Portfolio to DirectAdmin via SFTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Astro Static Site
        run: npm run build

      - name: Deploy Static Files to DirectAdmin
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || '22' }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR || '/public_html/' }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass rsync
          export SSHPASS="$SFTP_PASSWORD"
          echo "Removing existing index.html on remote server if present..."
          sshpass -e ssh -o StrictHostKeyChecking=no -p $SFTP_PORT $SFTP_USERNAME@$SFTP_SERVER "rm -f $SFTP_REMOTE_DIR/index.html" || true
          echo "Syncing static site files to DirectAdmin..."
          sshpass -e rsync -avz --ignore-times -e "ssh -o StrictHostKeyChecking=no -p $SFTP_PORT" ./dist/client/ $SFTP_USERNAME@$SFTP_SERVER:$SFTP_REMOTE_DIR
