name: Deploy Portfolio to DirectAdmin (SFTP/FTP)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Astro Static Site
        run: npm run build

      - name: Upload Static Files via SFTP/FTP to DirectAdmin
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ${{ secrets.SFTP_PROTOCOL || 'sftp' }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          local-dir: ./dist/
          server-dir: ${{ secrets.SFTP_REMOTE_DIR || '/public_html/' }}
